name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK and Tools (platform-tools, build-tools, NDK)
        run: |
          # Ensure env vars point to the runner SDK location
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # show SDK contents for debugging
          ls -la /usr/local/lib/android || true
          # Accept licenses (non-fatal) and install required packages including NDK
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;26.1.10909125"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android"

      - name: Install Dependencies
        run: |
          npm ci
          npm install -D @tauri-apps/cli@latest

      - name: Build Web Frontend
        run: npm run build

      - name: Generate Tauri Scaffold if Missing
        run: |
          if [ ! -d "src-tauri" ]; then
            echo "Initializing Tauri configuration..."
            # use --no-interactive to avoid prompts in CI
            npx @tauri-apps/cli init --app-name "Cricket-Closet-ERP" --window-title "Talk of the Town Cricket Closet ERP" --frontend-dist "../dist" --dev-url "http://localhost:5173" --no-interactive
          fi

      - name: Initialize Tauri Android Project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            # run the android init in non-interactive mode
            npx @tauri-apps/cli init ... --no-interactive -> npx @tauri-apps/cli init --ci ...
      - name: Build Android APK
        run: npx @tauri-apps/cli android init --no-interactive -> npx @tauri-apps/cli android init --ci
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Closet-ERP-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
