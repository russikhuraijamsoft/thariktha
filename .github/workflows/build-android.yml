name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android"

      - name: Install Dependencies
        run: |
          npm ci
          npm install -D @tauri-apps/cli@latest

      - name: Build Web Frontend
        run: npm run build

      - name: Generate Tauri Scaffold if Missing
        run: |
          if [ ! -d "src-tauri" ]; then
            echo "Initializing Tauri configuration..."
            npx @tauri-apps/cli init --app-name "Cricket-Closet-ERP" --window-title "Talk of the Town Cricket Closet ERP" --frontend-dist "../dist" --dev-url "http://localhost:5173" --ci
          fi

      - name: Initialize Tauri Android Project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci
          fi

      - name: Build Android APK
        run: npx @tauri-apps/cli android build --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Closet-ERP-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
