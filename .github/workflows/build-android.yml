name: Android packaging (manual, native prerequisites required)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Hosted HTTPS ERP API origin (native packages do not run Node)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require reviewed native project and locked CLI (do not auto-scaffold)
        run: node scripts/check-native.mjs
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install native SDK prerequisite
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
          printf 'NDK_HOME=%s/ndk/26.1.10909125\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - name: Build webview assets only (shared hosted API)
        run: npm run build:web
      - name: Require reviewed Android project
        run: test -f src-tauri/gen/android/gradlew
      - name: Build debug APK (not a signed production release)
        run: npm exec --no -- tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cricket-Closet-ERP-Android-debug-unverified-on-device
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
