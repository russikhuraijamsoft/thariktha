name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          # Known runner SDK location (used as a fallback)
          SDK_PATH=/usr/local/lib/android/sdk

          # Ensure env vars point to the runner SDK location if not already set,
          # export them into the current shell so this step can use them immediately,
          # and also write them to $GITHUB_ENV so subsequent steps see them.
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$SDK_PATH"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$SDK_PATH"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          fi

          # Prefer sdkmanager under the configured ANDROID_HOME/ANDROID_SDK_ROOT; fall back to known absolute path
          SDKMANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER_PATH" ]; then
            SDKMANAGER_PATH="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          fi

          # Accept licenses first to avoid interactive prompts, then install the NDK
          yes | "$SDKMANAGER_PATH" --licenses || true
          "$SDKMANAGER_PATH" --install "ndk;26.1.10909125"

          # Export and persist NDK paths for subsequent steps
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android"

      - name: Install Dependencies
        run: |
          npm ci
          npm install -D @tauri-apps/cli@latest

      - name: Build Web Frontend
        run: npm run build

      - name: Generate Tauri Scaffold if Missing
        run: |
          if [ ! -d "src-tauri" ]; then
            echo "Initializing Tauri configuration..."
            npx @tauri-apps/cli init --app-name "Cricket-Closet-ERP" --window-title "Talk of the Town Cricket Closet ERP" --frontend-dist "../dist" --dev-url "http://localhost:5173" --ci
          fi

      - name: Initialize Tauri Android Project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci
          fi

      - name: Build Android APK
        run: npx @tauri-apps/cli android build --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Closet-ERP-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
