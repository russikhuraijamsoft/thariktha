name: Build Desktop Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'Windows'
            artifact_name: 'Cricket-Closet-ERP-Windows'
            artifact_path: 'src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/nsis/*.exe'
          - platform: 'macos-latest'
            os_name: 'macOS'
            artifact_name: 'Cricket-Closet-ERP-macOS'
            artifact_path: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'
            artifact_name: 'Cricket-Closet-ERP-Linux'
            artifact_path: 'src-tauri/target/release/bundle/deb/*.deb, src-tauri/target/release/bundle/appimage/*.AppImage'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file libxdo-dev

      - name: Install Node Dependencies & Tauri CLI
        run: |
          npm ci
          npm install -D @tauri-apps/cli@latest

      - name: Build Web Application
        run: npm run build

      - name: Scaffold Tauri Configuration (If Not Present)
        shell: bash
        run: |
          IDENT="com.russikhuraijamsoft.cricketcloset.erp"
          if [ ! -d "src-tauri" ]; then
            echo "Initializing Tauri project structure..."
            npx @tauri-apps/cli init \
              --app-name "Cricket-Closet-ERP" \
              --window-title "Talk of the Town Cricket Closet ERP" \
              --frontend-dist "../dist" \
              --dev-url "http://localhost:5173" \
              --ci
          fi

          # Tauri v2 uses top-level `identifier` and `bundle` keys.
          if [ -f "src-tauri/tauri.conf.json" ]; then
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              c.identifier = '$IDENT';
              c.bundle = c.bundle || {};
              c.bundle.active = true;
              c.bundle.icon = [
                'icons/32x32.png',
                'icons/128x128.png',
                'icons/128x128@2x.png',
                'icons/icon.icns',
                'icons/icon.ico'
              ];
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\\n');
              console.log('Updated Tauri v2 bundle configuration in', p);
            "
          fi

      - name: Generate Desktop Icons (If Missing)
        shell: bash
        run: |
          if [ -f "public/icon.svg" ] && [ ! -d "src-tauri/icons" ]; then
            echo "Generating Tauri app icons..."
            npx @tauri-apps/cli icon public/icon.svg || true
          fi

      - name: Build Desktop Application Bundle
        run: npx @tauri-apps/cli build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
