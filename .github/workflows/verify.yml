name: ERP quality gate

on:
  push:
    branches: [main, hermes/production-erp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: git diff --check
      - run: npm run typecheck
      - name: Lint (documented TypeScript gate)
        run: npm run lint
      - run: npm test
      - name: Firestore transaction integration and security rules
        run: npm run test:erp
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: server-code-not-static-assets
          path: server-dist/
          if-no-files-found: error
