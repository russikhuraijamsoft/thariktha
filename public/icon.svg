<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1813"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="45%" stop-color="#E5B84B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#E5B84B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Outer Shield Badge -->
  <path d="M 256 64 L 396 112 C 396 260 256 360 256 420 C 256 360 116 260 116 112 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#goldGlow)"/>

  <!-- Inner Crest Outline -->
  <path d="M 256 94 L 372 134 C 372 250 256 332 256 385 C 256 332 140 250 140 134 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6,4"/>

  <!-- Crossed Cricket Bats -->
  <!-- Bat 1 (Top Left to Bottom Right) -->
  <g transform="rotate(42 256 240)">
    <!-- Blade -->
    <rect x="238" y="160" width="36" height="150" rx="8" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2"/>
    <!-- Shoulder -->
    <path d="M 242 160 Q 256 142 256 130 Q 256 142 270 160 Z" fill="url(#goldGrad)"/>
    <!-- Handle -->
    <rect x="250" y="80" width="12" height="56" rx="4" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
    <!-- Handle Grip Wraps -->
    <line x1="250" y1="92" x2="262" y2="92" stroke="#64748B" stroke-width="1.5"/>
    <line x1="250" y1="104" x2="262" y2="104" stroke="#64748B" stroke-width="1.5"/>
    <line x1="250" y1="116" x2="262" y2="116" stroke="#64748B" stroke-width="1.5"/>
    <line x1="250" y1="128" x2="262" y2="128" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- Bat 2 (Top Right to Bottom Left) -->
  <g transform="rotate(-42 256 240)">
    <!-- Blade -->
    <rect x="238" y="160" width="36" height="150" rx="8" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2"/>
    <!-- Shoulder -->
    <path d="M 242 160 Q 256 142 256 130 Q 256 142 270 160 Z" fill="url(#goldGrad)"/>
    <!-- Handle -->
    <rect x="250" y="80" width="12" height="56" rx="4" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
    <!-- Handle Grip Wraps -->
    <line x1="250" y1="92" x2="262" y2="92" stroke="#64748B" stroke-width="1.5"/>
    <line x1="250" y1="104" x2="262" y2="104" stroke="#64748B" stroke-width="1.5"/>
    <line x1="250" y1="116" x2="262" y2="116" stroke="#64748B" stroke-width="1.5"/>
    <line x1="250" y1="128" x2="262" y2="128" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- Cricket Ball Center -->
  <circle cx="256" cy="240" r="32" fill="#DC2626" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)"/>
  <path d="M 233 222 C 250 234 262 246 279 258" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="256" cy="240" r="32" fill="none" stroke="#991B1B" stroke-width="2"/>

  <!-- ERP Ribbon Banner -->
  <path d="M 160 380 L 256 364 L 352 380 L 336 414 L 256 400 L 176 414 Z" fill="#0A0A0A" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#FCD34D" text-anchor="middle" letter-spacing="3.5">CRICKET ERP</text>

  <!-- Top Crown Star -->
  <polygon points="256,122 261,135 275,135 264,143 268,156 256,148 244,156 248,143 237,135 251,135" fill="url(#goldGrad)"/>
</svg>
