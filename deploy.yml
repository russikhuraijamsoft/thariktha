name: Deploy ERP Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build --if-present

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: talkofthetownpos
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Configure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: talkofthetownpos
          settings: |
            [
              { "name": "DB_SERVER", "value": "cricketclosetdb.database.windows.net" },
              { "name": "DB_NAME", "value": "CricketClosetERP" },
              { "name": "AUTH_TYPE", "value": "EntraID" }
            ]
